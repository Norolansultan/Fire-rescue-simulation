name: CI

# Mirrors SPEC/10_Build_Plan_and_Acceptance.md §4: "Every push runs, in
# order: type check with strict settings; lint including the determinism
# bans and the module boundary rules; licence scan against the allowlist,
# transitively; unit tests; the golden-run determinism test; the
# truth-boundary integration test; the scenario validator against all
# fixture scenarios; the telemetry coverage and derived-measure tests. Any
# failure blocks merge."
#
# Steps wired so far, through M1 (engine and determinism) and M2
# (scenario contract and validator): type check, the determinism lint
# (now covering app/ and tools/), and the unit test suite (vitest runs
# everything under test/, which includes the golden-run determinism test,
# the render-boundary truth-leak tests, and the scenario contract/validator
# tests against fixture scenarios). Licence scan, module-boundary lint,
# and the telemetry coverage / derived-measure tests are added as the
# milestones that produce them (M3-M4) land — see SPEC/10 §3 for the
# dependency order.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict)
        run: npm run typecheck

      - name: Determinism lint (invariant I1, SPEC/05 §3)
        run: npm run lint:determinism

      - name: Unit tests, including the golden-run determinism test (SPEC/10 M1)
        run: npm test
